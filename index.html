<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>분리수거 대장</title>

    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Framer Motion -->
    <script src="https://unpkg.com/framer-motion@10.16.4/dist/framer-motion.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- html2canvas -->
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
    <!-- Canvas Confetti -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.2/dist/confetti.browser.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Jua&family=Gaegu:wght@400;700&family=Nunito:wght@700;900&display=swap');

        html {
            font-size: 16px;
        }

        body {
            margin: 0;
            overflow: hidden;
            font-family: 'Jua', 'Gaegu', sans-serif;
            background-color: #111827;
            touch-action: none;
            user-select: none;
            width: 100vw;
            height: 100vh;
        }

        .hide-scrollbar::-webkit-scrollbar {
            display: none;
        }

        .glass-panel {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(12px);
            border: 4px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.1);
        }

        .star-btn {
            transition: all 0.2s;
        }

        .star-btn:hover {
            transform: scale(1.2);
        }

        .ripple {
            animation: ripple 1.5s infinite linear;
        }

        @keyframes ripple {
            0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.5); }
            70% { box-shadow: 0 0 0 30px rgba(239, 68, 68, 0); }
            100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); }
        }

        @keyframes float-up {
            0% { transform: translateY(0) scale(1); opacity: 1; }
            100% { transform: translateY(-300px) scale(2); opacity: 0; }
        }

        .sticker-pop {
            animation: float-up 2s ease-out forwards;
        }

        @keyframes wiggle {
            0%, 100% { transform: rotate(-3deg); }
            50% { transform: rotate(3deg); }
        }

        .wiggle {
            animation: wiggle 1s ease-in-out infinite;
        }

        /* TTS 하이라이트용 */
        .tts-highlight {
            background: linear-gradient(120deg, #fef08a 0%, #fde047 100%);
            border-radius: 0.3em;
            padding: 0 0.2em;
            transition: all 0.2s;
        }
    </style>
</head>

<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useCallback } = React;
        const { motion, AnimatePresence } = window.Motion;

        // ============================================================
        // 음성(TTS) 시스템 - Google Wavenet/Neural 우선
        // ============================================================
        let cachedVoice = null;
        let voicesLoaded = false;

        const loadKoreanVoice = () => {
            return new Promise((resolve) => {
                const trySelect = () => {
                    const voices = window.speechSynthesis.getVoices();
                    if (!voices || voices.length === 0) return null;

                    // 1순위: Google 한국어 클라우드 음성
                    const googleKo = voices.find(v =>
                        v.lang === 'ko-KR' &&
                        v.name.toLowerCase().includes('google') &&
                        !v.localService
                    );
                    if (googleKo) return googleKo;

                    // 2순위: Wavenet/Neural2 명시적 이름
                    const wavenet = voices.find(v =>
                        v.lang === 'ko-KR' &&
                        /wavenet|neural|premium|enhanced|natural/i.test(v.name)
                    );
                    if (wavenet) return wavenet;

                    // 3순위: 일반 Google 한국어 (로컬이라도)
                    const anyGoogle = voices.find(v =>
                        v.lang === 'ko-KR' &&
                        v.name.toLowerCase().includes('google')
                    );
                    if (anyGoogle) return anyGoogle;

                    // 4순위: 아무 한국어 음성
                    const anyKo = voices.find(v => v.lang === 'ko-KR' || v.lang.startsWith('ko'));
                    return anyKo || null;
                };

                const v = trySelect();
                if (v) { cachedVoice = v; voicesLoaded = true; resolve(v); return; }

                // 음성 로드 대기
                window.speechSynthesis.onvoiceschanged = () => {
                    const found = trySelect();
                    if (found && !voicesLoaded) {
                        cachedVoice = found;
                        voicesLoaded = true;
                        resolve(found);
                    }
                };
                // 안전 타임아웃
                setTimeout(() => resolve(trySelect()), 1500);
            });
        };

        const Icon = ({ name, size = 24, className = "" }) => {
            const iconRef = useRef(null);
            useEffect(() => {
                if (iconRef.current && window.lucide.icons[name]) {
                    iconRef.current.innerHTML = "";
                    const iconNode = window.lucide.icons[name];
                    const svg = document.createElementNS("http://www.w3.org/2000/svg", "svg");
                    svg.setAttribute("xmlns", "http://www.w3.org/2000/svg");
                    svg.setAttribute("width", size);
                    svg.setAttribute("height", size);
                    svg.setAttribute("viewBox", "0 0 24 24");
                    svg.setAttribute("fill", "none");
                    svg.setAttribute("stroke", "currentColor");
                    svg.setAttribute("stroke-width", "2.5");
                    svg.setAttribute("stroke-linecap", "round");
                    svg.setAttribute("stroke-linejoin", "round");
                    if (className) svg.setAttribute("class", className);

                    if (Array.isArray(iconNode)) {
                        let children = iconNode;
                        if (iconNode.length === 3 && iconNode[0] === 'svg') {
                            Object.entries(iconNode[1]).forEach(([k, v]) => {
                                if (k !== 'class') svg.setAttribute(k, v);
                            });
                            children = iconNode[2];
                        }
                        children.forEach(([tag, attrs]) => {
                            const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
                            Object.entries(attrs).forEach(([k, v]) => el.setAttribute(k, v));
                            svg.appendChild(el);
                        });
                    }
                    iconRef.current.appendChild(svg);
                }
            }, [name, size, className]);
            return <div ref={iconRef} className="inline-flex" />;
        };

        const BIN_TYPES = [
            { id: '플라스틱류', name: '플라스틱', icon: '🥤', color: 'bg-blue-100 text-blue-800 border-blue-400' },
            { id: '종이류', name: '종이', icon: '📦', color: 'bg-yellow-100 text-yellow-800 border-yellow-400' },
            { id: '병류', name: '유리병', icon: '🫙', color: 'bg-red-100 text-red-800 border-red-400' },
            { id: '캔류', name: '캔/고철', icon: '🥫', color: 'bg-gray-200 text-gray-800 border-gray-500' },
            { id: '비닐류', name: '비닐', icon: '🛍️', color: 'bg-slate-200 text-slate-800 border-slate-500' },
            { id: '일반쓰레기', name: '일반쓰레기', icon: '🗑️', color: 'bg-stone-200 text-stone-800 border-stone-500' }
        ];

        // 분리수거 헷갈리는 퀴즈 (개념학습) - 정답+힌트 포함
        const TRICKY_QUIZZES = [
            {
                id: 'paper-cup',
                icon: '🥤',
                question: '종이컵은 어떻게 분류할까요?',
                answer: '일반쓰레기',
                hint: '종이컵은 안쪽에 비닐(코팅)이 발라져 있어서 일반 종이와 달라요. 그래서 일반쓰레기로 버려야 해요!'
            },
            {
                id: 'tissue',
                icon: '🧻',
                question: '사용한 휴지는 어떻게 분류할까요?',
                answer: '일반쓰레기',
                hint: '사용한 휴지는 물이나 음식이 묻어 있어서 재활용이 안 돼요. 일반쓰레기로 버려요!'
            },
            {
                id: 'small-paper',
                icon: '📄',
                question: '작은 영수증이나 메모지는 어떻게 분류할까요?',
                answer: '일반쓰레기',
                hint: '너무 작은 종이나 영수증은 특수 코팅이 되어 있어서 재활용이 안 돼요. 일반쓰레기로 버려요!'
            },
            {
                id: 'pet-bottle',
                icon: '🥤',
                question: '페트병은 어떻게 분류할까요?',
                answer: '플라스틱류',
                hint: '페트병은 라벨을 떼고, 안을 깨끗이 씻고, 뚜껑을 빼서 플라스틱류에 버려요!'
            },
            {
                id: 'milk-carton',
                icon: '🥛',
                question: '우유팩은 어떻게 분류할까요?',
                answer: '종이류',
                hint: '우유팩은 깨끗이 씻어 말려서 종이류에 버려요. 일반 종이와 따로 모으면 더 좋아요!'
            },
            {
                id: 'plastic-bag',
                icon: '🛍️',
                question: '과자봉지나 비닐봉투는 어떻게 분류할까요?',
                answer: '비닐류',
                hint: '비닐은 비닐류에 따로 모아 버려요. 음식물이 묻었으면 깨끗이 씻어서 버려요!'
            }
        ];

        const QUIZ_BINS_FOR_CHOICE = [
            { id: '플라스틱류', name: '플라스틱', icon: '🥤' },
            { id: '종이류', name: '종이', icon: '📦' },
            { id: '병류', name: '유리병', icon: '🫙' },
            { id: '캔류', name: '캔', icon: '🥫' },
            { id: '비닐류', name: '비닐', icon: '🛍️' },
            { id: '일반쓰레기', name: '일반쓰레기', icon: '🗑️' }
        ];

        const GAS_URL = "https://script.google.com/macros/s/AKfycbyVERNJF2Gcw7AA15cL6FU5mdi2RG1GGrW_4-6-KXyBHy7kLuhUQd8OX4QxxIQXMaT7/exec";

        // ============================================================
        // 칭찬 스티커 (폭죽 + 떠오르는 이모지)
        // ============================================================
        const triggerCelebration = (intensity = 'normal') => {
            if (!window.confetti) return;
            const opts = {
                particleCount: intensity === 'big' ? 200 : 100,
                spread: 90,
                origin: { y: 0.6 },
                colors: ['#fde047', '#f472b6', '#60a5fa', '#34d399', '#fb923c', '#a78bfa']
            };
            window.confetti(opts);
            if (intensity === 'big') {
                setTimeout(() => window.confetti({ ...opts, angle: 60, origin: { x: 0, y: 0.7 } }), 200);
                setTimeout(() => window.confetti({ ...opts, angle: 120, origin: { x: 1, y: 0.7 } }), 400);
            }
        };

        const App = () => {
            const [speakerEnabled, setSpeakerEnabled] = useState(false);
            const [isSaving, setIsSaving] = useState(false);
            const [micPermissionGranted, setMicPermissionGranted] = useState(false);
            const [showMicGate, setShowMicGate] = useState(true);

            const [students, setStudents] = useState([]);
            const [problems, setProblems] = useState([]);
            const [exampleSentences, setExampleSentences] = useState([
                "분리수거는 종이, 플라스틱, 캔, 병, 비닐을 나누어 버리는 것이에요.",
                "분리수거를 하면 쓰레기가 줄어들고, 새 물건을 만들 수 있어요.",
                "플라스틱 병은 깨끗이 씻어서 뚜껑을 빼고 버려요.",
                "종이는 테이프를 떼고 납작하게 접어서 버려요.",
                "오늘 활동을 통해 분리수거가 정말 중요하다는 것을 배웠어요."
            ]);
            const [isLoading, setIsLoading] = useState(true);

            // 진행 상태
            const [studentName, setStudentName] = useState("");
            const [step, setStep] = useState(0);
            const [preRecordData, setPreRecordData] = useState(null);
            const [postRecordData, setPostRecordData] = useState(null);
            const [artworkNameData, setArtworkNameData] = useState(null);
            const [actualArtworkData, setActualArtworkData] = useState(null);
            const [blueprintData, setBlueprintData] = useState(null);
            const [blueprintScreenRec, setBlueprintScreenRec] = useState(null); // 화면 녹화 base64
            const [stars, setStars] = useState(0);

            // 도움 기록
            const [helpUsedCount, setHelpUsedCount] = useState({ pre: 0, post: 0, artwork: 0, quiz: 0 });

            // 헷갈리는 분리수거 퀴즈
            const [quizResults, setQuizResults] = useState([]); // [{id, correct, helpUsed}]

            // 설계도 영상 자기평가
            const [blueprintSelfStars, setBlueprintSelfStars] = useState(0);

            // 매칭 게임
            const MATCHING_PAIRS = [
                { id: 'bottle', trashIcon: '🥤', trashName: '플라스틱병', upcycleIcon: '👜', upcycleName: '에코백', message: '페트병을 모아서 녹이면\n멋진 에코백이 된답니다!' },
                { id: 'can', trashIcon: '🥫', trashName: '캔/고철', upcycleIcon: '🚲', upcycleName: '자전거', message: '캔을 분리수거하면\n튼튼한 자전거로 다시 태어나요!' },
                { id: 'carton', trashIcon: '📦', trashName: '종이박스', upcycleIcon: '🧻', upcycleName: '두루마리 휴지', message: '종이를 깨끗이 모으면\n부드러운 휴지가 된답니다!' }
            ];
            const [selectedMatchingTrash, setSelectedMatchingTrash] = useState(null);
            const [matchedPairs, setMatchedPairs] = useState([]);
            const [matchingPopup, setMatchingPopup] = useState(null);
            const [matchingWrongPopup, setMatchingWrongPopup] = useState(false);

            // 미니게임
            const [collectedTrash, setCollectedTrash] = useState([]);
            const [seaTrash, setSeaTrash] = useState([]);
            const [popupTrash, setPopupTrash] = useState(null);
            const [feedbackPopup, setFeedbackPopup] = useState(null);
            const [selectedTrashForSort, setSelectedTrashForSort] = useState(null);
            const [sortedTrash, setSortedTrash] = useState([]);

            // 칭찬 스티커 모음
            const [collectedStickers, setCollectedStickers] = useState([]);

            // 화면녹화 (설계도)
            const screenRecorderRef = useRef(null);
            const screenChunksRef = useRef([]);
            const [isScreenRecording, setIsScreenRecording] = useState(false);

            // ============================================================
            // 스케일 훅 (반응형) - 짤림 없게, 위아래 살짝 여백
            // ============================================================
            const useScale = () => {
                const [scale, setScale] = useState(1);
                useEffect(() => {
                    const handleResize = () => {
                        const targetW = 1920, targetH = 1080;
                        const scaleX = window.innerWidth / targetW;
                        const scaleY = window.innerHeight / targetH;
                        // 더 작은 비율 * 0.96 -> 어떤 화면에서도 안 잘리게 살짝 여백
                        setScale(Math.min(scaleX, scaleY) * 0.96);
                    };
                    window.addEventListener('resize', handleResize);
                    handleResize();
                    return () => window.removeEventListener('resize', handleResize);
                }, []);
                return scale;
            };
            const scale = useScale();

            // ============================================================
            // 마이크 권한 게이트 (앱 시작 시 1회)
            // ============================================================
            const requestMicPermission = async () => {
                try {
                    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    stream.getTracks().forEach(t => t.stop());
                    setMicPermissionGranted(true);
                    setShowMicGate(false);
                } catch (err) {
                    // 거부해도 진행은 가능 (키보드 입력)
                    setMicPermissionGranted(false);
                    setShowMicGate(false);
                }
            };

            // ============================================================
            // 데이터 로드
            // ============================================================
            useEffect(() => {
                loadKoreanVoice(); // 음성 미리 로드

                if (!GAS_URL || !GAS_URL.startsWith("http")) {
                    setStudents(["김철수", "이영희", "박지민"]);
                    setProblems([
                        { type: '플라스틱류', name: '플라스틱 컵', icon: '🥤', fact: '플라스틱 컵은\n내용물을 비우고 버려요!' },
                        { type: '종이류', name: '종이상자', icon: '📦', fact: '종이상자는 테이프를 떼고\n납작하게 접어서 버려요!' },
                        { type: '병류', name: '유리병', icon: '🫙', fact: '유리병은 깨지지 않게\n조심해서 버려요.' },
                        { type: '캔류', name: '통조림 캔', icon: '🥫', fact: '통조림 캔은 다 먹고\n안을 깨끗이 씻어서 버려요.' }
                    ]);
                    setIsLoading(false);
                    return;
                }

                fetch(`${GAS_URL}?action=getData`)
                    .then(res => res.json())
                    .then(data => {
                        if (data.students) setStudents(data.students.filter(s => s));
                        if (data.problems) {
                            const parsed = data.problems.map(p => {
                                let newIcon = p.icon;
                                let newName = p.name;
                                if (p.type === '플라스틱류') { newIcon = '🥤'; newName = newName || '플라스틱 컵'; }
                                else if (p.type === '종이류') { newIcon = '📦'; newName = newName || '종이상자'; }
                                else if (p.type === '병류' || p.type === '유리류') { newIcon = '🫙'; newName = newName || '유리병'; }
                                else if (p.type === '캔류') { newIcon = '🥫'; newName = newName || '통조림 캔'; }
                                else if (p.type === '비닐류') { newIcon = '🛍️'; newName = newName || '비닐 봉투'; }
                                return {
                                    type: p.type,
                                    name: newName,
                                    icon: newIcon,
                                    fact: (p.fact || '분리수거를 잘 합시다!').replace(/\\n/g, '\n')
                                };
                            }).filter(p => p.type && p.name);
                            setProblems(parsed);
                        }
                        if (data.examples && Array.isArray(data.examples) && data.examples.length > 0) {
                            setExampleSentences(data.examples);
                        }
                        setIsLoading(false);
                    })
                    .catch(err => {
                        console.error(err);
                        setStudents(["김철수", "이영희", "박지민"]);
                        setProblems([
                            { type: '플라스틱류', name: '플라스틱 컵', icon: '🥤', fact: '플라스틱 컵은\n내용물을 비우고 버려요!' },
                            { type: '종이류', name: '종이상자', icon: '📦', fact: '종이상자는 테이프를 떼고\n납작하게 접어서 버려요!' },
                            { type: '병류', name: '유리병', icon: '🫙', fact: '유리병은 깨지지 않게\n조심해서 버려요.' },
                            { type: '캔류', name: '통조림 캔', icon: '🥫', fact: '통조림 캔은 다 먹고\n안을 깨끗이 씻어서 버려요.' }
                        ]);
                        setIsLoading(false);
                    });
            }, []);

            // ============================================================
            // 오디오 처리
            // ============================================================
            const stopSpeak = () => {
                if (window.speechSynthesis) window.speechSynthesis.cancel();
            };

            const speak = (text, opts = {}) => {
                if (!speakerEnabled || !window.speechSynthesis || !text) return;
                stopSpeak();
                const utter = new SpeechSynthesisUtterance(text);
                utter.lang = 'ko-KR';
                utter.rate = opts.rate ?? 0.95;
                utter.pitch = opts.pitch ?? 1.0;
                utter.volume = 1.0;
                if (cachedVoice) utter.voice = cachedVoice;
                window.speechSynthesis.speak(utter);
            };

            const playEffect = (type) => {
                if (!speakerEnabled) return;
                try {
                    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                    const oscillator = audioCtx.createOscillator();
                    const gainNode = audioCtx.createGain();
                    oscillator.connect(gainNode);
                    gainNode.connect(audioCtx.destination);

                    if (type === 'correct') {
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(523.25, audioCtx.currentTime);
                        oscillator.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.1);
                        oscillator.frequency.setValueAtTime(783.99, audioCtx.currentTime + 0.2);
                        gainNode.gain.setValueAtTime(0.15, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.6);
                        oscillator.start();
                        oscillator.stop(audioCtx.currentTime + 0.6);
                    } else if (type === 'wrong') {
                        oscillator.type = 'sawtooth';
                        oscillator.frequency.setValueAtTime(300, audioCtx.currentTime);
                        oscillator.frequency.setValueAtTime(200, audioCtx.currentTime + 0.2);
                        gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                        oscillator.start();
                        oscillator.stop(audioCtx.currentTime + 0.4);
                    } else if (type === 'sticker') {
                        oscillator.type = 'sine';
                        oscillator.frequency.setValueAtTime(880, audioCtx.currentTime);
                        oscillator.frequency.setValueAtTime(1108, audioCtx.currentTime + 0.08);
                        oscillator.frequency.setValueAtTime(1318, audioCtx.currentTime + 0.16);
                        gainNode.gain.setValueAtTime(0.12, audioCtx.currentTime);
                        gainNode.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.4);
                        oscillator.start();
                        oscillator.stop(audioCtx.currentTime + 0.4);
                    }
                } catch (e) { console.log(e); }
            };

            // 자동 음성 안내
            useEffect(() => {
                if (!speakerEnabled) return;
                let text = "";
                switch (step) {
                    case 0: text = "이름을 골라서 멋진 분리수거 박사가 되어볼까요?"; break;
                    case 1: text = "활동 전에 먼저, 지금 알고 있는 분리수거에 대해 말해주세요."; break;
                    case 2: text = "바다에 떠다니는 쓰레기들을 손가락으로 눌러서 모두 주워주세요."; break;
                    case 3: text = "주운 쓰레기를 누르고, 알맞은 분리수거함을 골라주세요."; break;
                    case 4: text = "헷갈리는 분리수거! 잘 모르겠으면 힌트 버튼을 눌러봐요."; break;
                    case 5: text = "쓰레기의 놀라운 변신! 어떤 물건으로 변하는지 짝을 맞춰보세요."; break;
                    case 6: text = "예시 작품을 보고, 나만의 작품 이름을 녹음해주세요!"; break;
                    case 7: text = "재활용품으로 무엇을 만들지 설계도를 그려보세요!"; break;
                    case 8: text = "내가 녹화한 영상을 다시 보고, 스스로 별점을 줘봐요!"; break;
                    case 9: text = "완성한 작품 사진이 있다면 찍어 올려주세요!"; break;
                    case 10: text = "활동 후, 새롭게 알게 된 점을 말해주세요. 처음과 비교해봐요!"; break;
                    case 11: text = "최고의 분리수거 박사! 스스로에게 별점을 주고 임명장을 받아가세요!"; break;
                }
                if (text) setTimeout(() => speak(text), 500);
            }, [step, speakerEnabled]);

            // ============================================================
            // 핸들러
            // ============================================================
            const handleNextStep = () => {
                stopSpeak();
                setStep(prev => prev + 1);
            };

            const handleToggleSpeaker = () => {
                const next = !speakerEnabled;
                setSpeakerEnabled(next);
                if (next) {
                    setTimeout(() => speak("소리가 켜졌어요! 이제 잘 들으면서 활동해봐요."), 100);
                } else {
                    stopSpeak();
                }
            };

            const startCollecting = () => {
                const initial = problems.map((p, i) => ({
                    ...p,
                    uid: Date.now() + i,
                    x: Math.random() * 70 + 10,
                    y: Math.random() * 60 + 15
                }));
                setSeaTrash(initial);
                setCollectedTrash([]);
                handleNextStep();
            };

            const handleCollect = (trash) => {
                setSeaTrash(prev => prev.filter(t => t.uid !== trash.uid));
                setPopupTrash(trash);
                speak(trash.fact);
            };

            const closePopupAndContinue = () => {
                setCollectedTrash(prev => [...prev, popupTrash]);
                setPopupTrash(null);
            };

            const getPostPosition = (word) => {
                if (!word) return '은(는)';
                const lastChar = word.charCodeAt(word.length - 1);
                if (lastChar < 0xAC00 || lastChar > 0xD7A3) return '은(는)';
                const hasJongseong = (lastChar - 0xAC00) % 28 > 0;
                return hasJongseong ? '은' : '는';
            };

            const handleSort = (trash, targetBinId) => {
                const josa = getPostPosition(trash.name);
                if (trash.type === targetBinId) {
                    playEffect('correct');
                    triggerCelebration('normal');
                    const binName = BIN_TYPES.find(b => b.id === targetBinId).name;
                    speak(`맞았어요! ${trash.name}${josa} ${binName}에 버려야 해요.`);
                    setFeedbackPopup({ isCorrect: true, message: `딩동댕!\n${trash.name}${josa} ${binName}에 쏙!` });
                    setTimeout(() => {
                        setFeedbackPopup(null);
                        setCollectedTrash(prev => prev.filter(t => t.uid !== trash.uid));
                        setSortedTrash(prev => [...prev, trash]);
                        setSelectedTrashForSort(null);
                    }, 1800);
                } else {
                    playEffect('wrong');
                    const correctBin = BIN_TYPES.find(b => b.id === trash.type);
                    speak(`아니에요. ${trash.name}${josa} ${correctBin ? correctBin.name : ''}에 버려요. 다시 해봐요!`);
                    setFeedbackPopup({
                        isCorrect: false,
                        message: `이런!\n${trash.name}${josa} 여기가 아니에요.\n${correctBin ? correctBin.name + '을(를) 찾아봐요!' : '다시 골라봐요!'}`
                    });
                    setSelectedTrashForSort(null);
                    setTimeout(() => setFeedbackPopup(null), 2500);
                }
            };

            // ============================================================
            // 화면 녹화 (설계도 단계)
            // ============================================================
            const startScreenRecording = async () => {
                try {
                    const displayStream = await navigator.mediaDevices.getDisplayMedia({
                        video: { mediaSource: "screen" },
                        audio: false
                    });
                    let combinedStream = displayStream;
                    try {
                        const audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        combinedStream = new MediaStream([
                            ...displayStream.getVideoTracks(),
                            ...audioStream.getAudioTracks()
                        ]);
                    } catch (e) { /* 마이크 없어도 화면만 녹화 */ }

                    screenChunksRef.current = [];
                    const recorder = new MediaRecorder(combinedStream, { mimeType: 'video/webm' });
                    recorder.ondataavailable = e => { if (e.data.size > 0) screenChunksRef.current.push(e.data); };
                    recorder.onstop = () => {
                        const blob = new Blob(screenChunksRef.current, { type: 'video/webm' });
                        const reader = new FileReader();
                        reader.onloadend = () => setBlueprintScreenRec(reader.result);
                        reader.readAsDataURL(blob);
                        combinedStream.getTracks().forEach(t => t.stop());
                    };

                    // 사용자가 브라우저 자체 "공유 중지" 버튼을 누르는 경우 처리
                    displayStream.getVideoTracks()[0].addEventListener('ended', () => {
                        if (recorder.state !== 'inactive') recorder.stop();
                        setIsScreenRecording(false);
                    });

                    recorder.start();
                    screenRecorderRef.current = recorder;
                    setIsScreenRecording(true);
                    speak("녹화를 시작했어요! 그리면서 어떤 작품을 만들지 말해주세요.");
                } catch (err) {
                    // 권한 거부되거나 환경상 불가 - 친절한 안내
                    speak("녹화를 시작할 수 없어요. 그냥 그리기만 해도 괜찮아요!");
                    console.log("화면 녹화 사용 불가:", err.message);
                }
            };

            const stopScreenRecording = () => {
                if (screenRecorderRef.current && screenRecorderRef.current.state !== 'inactive') {
                    screenRecorderRef.current.stop();
                }
                setIsScreenRecording(false);
            };

            const downloadCertificate = () => {
                const element = document.getElementById("certificate-area");
                if (element && window.html2canvas) {
                    window.html2canvas(element, { scale: 2, useCORS: true, backgroundColor: '#ffffff' }).then(canvas => {
                        const link = document.createElement("a");
                        link.download = `${studentName}_분리수거대장_임명장.png`;
                        link.href = canvas.toDataURL("image/png");
                        link.click();
                    });
                }
            };

            const saveAllData = () => {
                setIsSaving(true);
                const quizCorrect = quizResults.filter(r => r.correct).length;
                const quizHelpUsed = quizResults.filter(r => r.helpUsed).length;
                const data = {
                    studentName,
                    artworkNameText: artworkNameData ? artworkNameData.text : "",
                    preRecordText: preRecordData?.text || "",
                    preRecordUrl: "",
                    postRecordText: postRecordData?.text || "",
                    postRecordUrl: "",
                    blueprintImageUrl: "",
                    blueprintDriveUrl: "",
                    actualImageUrl: "",
                    actualDriveUrl: "",
                    screenRecUrl: "",
                    stars,
                    blueprintSelfStars,
                    stickers: collectedStickers.length,
                    helpUsed: helpUsedCount.pre + helpUsedCount.post + helpUsedCount.artwork + (helpUsedCount.quiz || 0),
                    quizCorrect,
                    quizTotal: TRICKY_QUIZZES.length,
                    quizHelpUsed,
                    matchedCount: matchedPairs.length,
                    sortedCount: sortedTrash.length
                };

                if (!GAS_URL || !GAS_URL.startsWith("http")) {
                    setTimeout(() => {
                        setIsSaving(false);
                        alert("저장이 완료되었습니다! (로컬 모드)");
                        window.location.reload();
                    }, 1500);
                    return;
                }

                const uploadPromises = [];
                if (preRecordData?.base64) {
                    uploadPromises.push(
                        fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'uploadAudio', base64Data: preRecordData.base64, filename: `${studentName}_사전녹음.webm` })
                        }).then(res => res.json()).then(r => ({ type: 'pre', url: r.url }))
                    );
                }
                if (postRecordData?.base64) {
                    uploadPromises.push(
                        fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'uploadAudio', base64Data: postRecordData.base64, filename: `${studentName}_사후녹음.webm` })
                        }).then(res => res.json()).then(r => ({ type: 'post', url: r.url }))
                    );
                }
                if (blueprintData) {
                    uploadPromises.push(
                        fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'uploadImage', base64Data: blueprintData, filename: `${studentName}_설계도.png` })
                        }).then(res => res.json()).then(r => ({ type: 'blueprint', driveUrl: r.driveUrl, imageUrl: r.imageUrl }))
                    );
                }
                if (actualArtworkData) {
                    uploadPromises.push(
                        fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'uploadImage', base64Data: actualArtworkData, filename: `${studentName}_실제작품.png` })
                        }).then(res => res.json()).then(r => ({ type: 'actual', driveUrl: r.driveUrl, imageUrl: r.imageUrl }))
                    );
                }
                if (blueprintScreenRec) {
                    uploadPromises.push(
                        fetch(GAS_URL, {
                            method: 'POST',
                            headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                            body: JSON.stringify({ action: 'uploadVideo', base64Data: blueprintScreenRec, filename: `${studentName}_설계도녹화.webm` })
                        }).then(res => res.json()).then(r => ({ type: 'screen', url: r.url }))
                    );
                }

                Promise.all(uploadPromises).then(results => {
                    results.forEach(r => {
                        if (r.type === 'pre') data.preRecordUrl = r.url;
                        if (r.type === 'post') data.postRecordUrl = r.url;
                        if (r.type === 'blueprint') { data.blueprintDriveUrl = r.driveUrl; data.blueprintImageUrl = r.imageUrl; }
                        if (r.type === 'actual') { data.actualDriveUrl = r.driveUrl; data.actualImageUrl = r.imageUrl; }
                        if (r.type === 'screen') data.screenRecUrl = r.url;
                    });
                    return fetch(GAS_URL, {
                        method: 'POST',
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                        body: JSON.stringify({ action: 'saveResult', resultData: data })
                    });
                })
                .then(res => res.json())
                .then(resData => {
                    setIsSaving(false);
                    if (resData.success) {
                        alert("저장되었어요! 활동을 마칠게요. 수고했어요!");
                        window.location.reload();
                    } else {
                        alert("저장 실패: " + resData.error);
                    }
                })
                .catch(err => {
                    console.error(err);
                    alert("서버 연결에 실패했어요. 다시 시도해주세요.");
                    setIsSaving(false);
                });
            };

            // ============================================================
            // 칭찬 스티커 컴포넌트
            // ============================================================
            const StickerReward = ({ onAdd, label }) => {
                const stickerOptions = [
                    { emoji: '⭐', name: '반짝별' },
                    { emoji: '💖', name: '사랑하트' },
                    { emoji: '🌸', name: '예쁜꽃' },
                    { emoji: '🌟', name: '큰별' },
                    { emoji: '🎉', name: '폭죽' },
                    { emoji: '🏆', name: '트로피' }
                ];
                const [picked, setPicked] = useState(null);

                const give = (s) => {
                    setPicked(s);
                    playEffect('sticker');
                    triggerCelebration('big');
                    onAdd(s);
                };

                return (
                    <div className="bg-gradient-to-br from-pink-50 to-purple-50 p-8 rounded-[3rem] border-8 border-pink-300 shadow-2xl">
                        <h3 className="text-4xl font-bold text-pink-700 text-center mb-2">🎁 나에게 칭찬 스티커 주기!</h3>
                        <p className="text-2xl font-bold text-purple-600 text-center mb-6">녹음을 잘 했어요! 어떤 스티커를 줄까요?</p>
                        <div className="grid grid-cols-6 gap-4">
                            {stickerOptions.map(s => (
                                <button
                                    key={s.emoji}
                                    onClick={() => give(s)}
                                    disabled={picked}
                                    className={`p-4 rounded-3xl border-4 transition-all ${picked === s ? 'border-pink-500 bg-pink-100 scale-110' : 'border-pink-200 bg-white hover:bg-pink-50 hover:scale-105'} ${picked && picked !== s ? 'opacity-30' : ''}`}
                                >
                                    <div className="text-6xl mb-2">{s.emoji}</div>
                                    <div className="text-xl font-bold text-pink-700">{s.name}</div>
                                </button>
                            ))}
                        </div>
                        {picked && (
                            <motion.p
                                initial={{ scale: 0 }} animate={{ scale: 1 }}
                                className="text-3xl font-bold text-purple-700 text-center mt-6"
                            >
                                {picked.emoji} {picked.name} 스티커를 받았어요! 정말 잘했어요! {picked.emoji}
                            </motion.p>
                        )}
                    </div>
                );
            };

            // ============================================================
            // 녹음 컴포넌트 (개선판: 키보드 입력, 도움받기, 자기 별점, 다시 녹음, 칭찬 스티커)
            // ============================================================
            const RecorderComponent = ({ onComplete, defaultText, helpKey, exampleList }) => {
                const [isRecording, setIsRecording] = useState(false);
                const [text, setText] = useState("");
                const [audioBase64, setAudioBase64] = useState(null);
                const [audioBlob, setAudioBlob] = useState(null);
                const [phase, setPhase] = useState('idle'); // idle | recording | review | sticker
                const [selfStars, setSelfStars] = useState(0);
                const [helpCount, setHelpCount] = useState(0);
                const [stickerGiven, setStickerGiven] = useState(null);

                const textRef = useRef("");
                const mediaRecorderRef = useRef(null);
                const chunksRef = useRef([]);
                const recognitionRef = useRef(null);
                const streamRef = useRef(null);

                const updateText = (newText) => {
                    setText(newText);
                    textRef.current = newText;
                };

                const startRecording = async () => {
                    stopSpeak();
                    updateText("");
                    chunksRef.current = [];
                    setAudioBase64(null);
                    setAudioBlob(null);

                    try {
                        const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                        streamRef.current = stream;
                        const recorder = new MediaRecorder(stream);
                        mediaRecorderRef.current = recorder;

                        recorder.ondataavailable = e => {
                            if (e.data.size > 0) chunksRef.current.push(e.data);
                        };
                        recorder.onstop = () => {
                            const blob = new Blob(chunksRef.current, { type: 'audio/webm' });
                            setAudioBlob(blob);
                            const reader = new FileReader();
                            reader.onloadend = () => setAudioBase64(reader.result);
                            reader.readAsDataURL(blob);
                            stream.getTracks().forEach(t => t.stop());
                        };
                        recorder.start();

                        // STT
                        if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) {
                            const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
                            recognitionRef.current = new SR();
                            recognitionRef.current.lang = 'ko-KR';
                            recognitionRef.current.continuous = true;
                            recognitionRef.current.interimResults = true;

                            let finalText = "";
                            recognitionRef.current.onresult = (event) => {
                                let interim = '';
                                for (let i = event.resultIndex; i < event.results.length; ++i) {
                                    if (event.results[i].isFinal) {
                                        finalText += event.results[i][0].transcript + " ";
                                    } else {
                                        interim += event.results[i][0].transcript;
                                    }
                                }
                                updateText((finalText + interim).trim());
                            };
                            try { recognitionRef.current.start(); } catch (e) { }
                        }

                        setIsRecording(true);
                        setPhase('recording');
                        speak("녹음을 시작했어요. 천천히 말해주세요.");
                    } catch (err) {
                        alert("마이크를 사용할 수 없어요. 키보드로 직접 입력해도 괜찮아요!");
                        setPhase('review'); // 키보드 모드로 진입
                    }
                };

                const stopRecording = () => {
                    if (mediaRecorderRef.current && mediaRecorderRef.current.state !== 'inactive') {
                        mediaRecorderRef.current.stop();
                    }
                    if (recognitionRef.current) {
                        try { recognitionRef.current.stop(); } catch (e) { }
                    }
                    setIsRecording(false);
                    setPhase('review');
                };

                const playBack = () => {
                    if (!audioBlob) return;
                    const url = URL.createObjectURL(audioBlob);
                    const audio = new Audio(url);
                    audio.play();
                };

                const playText = () => {
                    speak(text, { rate: 0.9 });
                };

                const readHelp = (sentence) => {
                    speak(sentence, { rate: 0.85 });
                    setHelpCount(prev => prev + 1);
                    setHelpUsedCount(prev => ({ ...prev, [helpKey]: (prev[helpKey] || 0) + 1 }));
                };

                const retryRecord = () => {
                    setSelfStars(0);
                    setStickerGiven(null);
                    setPhase('idle');
                    updateText("");
                    setAudioBase64(null);
                    setAudioBlob(null);
                };

                const finalSubmit = () => {
                    onComplete({
                        text: textRef.current,
                        base64: audioBase64,
                        selfStars,
                        helpCount,
                        sticker: stickerGiven
                    });
                };

                const handleSelfStar = (n) => {
                    setSelfStars(n);
                    if (n >= 4) {
                        triggerCelebration('big');
                        playEffect('correct');
                    } else {
                        playEffect('sticker');
                    }
                };

                return (
                    <div className="bg-white p-10 rounded-[3rem] shadow-2xl max-w-5xl w-full flex flex-col items-center gap-6 border-8 border-green-300">
                        <h3 className="text-5xl font-bold text-green-800 text-center break-keep leading-tight">{defaultText}</h3>

                        {/* 도움받기 버튼 (예시 문장 듣기) */}
                        <div className="w-full bg-yellow-50 border-4 border-yellow-300 rounded-3xl p-5 flex flex-col gap-3">
                            <div className="flex items-center gap-3">
                                <span className="text-3xl">💡</span>
                                <span className="text-3xl font-bold text-yellow-800">어려우면 도움받기!</span>
                                {helpCount > 0 && <span className="ml-auto bg-yellow-200 text-yellow-800 px-4 py-1 rounded-full text-xl font-bold">도움받았어요 {helpCount}번</span>}
                            </div>
                            <div className="flex gap-2 flex-wrap">
                                {exampleList.slice(0, 3).map((ex, i) => (
                                    <button key={i} onClick={() => readHelp(ex)}
                                        className="flex-1 min-w-[200px] bg-white border-4 border-yellow-300 rounded-2xl p-3 text-xl font-bold text-yellow-900 hover:bg-yellow-100 active:scale-95">
                                        <Icon name="Volume2" size={28} className="inline mr-2" />
                                        예시 {i + 1} 듣기
                                    </button>
                                ))}
                            </div>
                        </div>

                        {/* 텍스트 표시 / 키보드 입력 */}
                        <div className="w-full">
                            <label className="text-2xl font-bold text-gray-600 mb-2 block">📝 말한 내용 (또는 직접 쓰기)</label>
                            <textarea
                                value={text}
                                onChange={e => updateText(e.target.value)}
                                placeholder={isRecording ? "듣고 있어요..." : "여기에 말한 내용이 나타나거나, 직접 글로 쓸 수 있어요!"}
                                className="w-full min-h-[10rem] bg-green-50 rounded-2xl p-6 border-4 border-green-200 text-3xl text-gray-800 leading-relaxed focus:outline-none focus:border-green-500"
                                style={{ fontFamily: 'Gaegu, Jua, sans-serif' }}
                            />
                        </div>

                        {/* idle: 시작 버튼 */}
                        {phase === 'idle' && (
                            <div className="flex gap-4 w-full">
                                <button onClick={startRecording}
                                    className="flex-1 flex items-center justify-center gap-3 bg-red-500 text-white px-8 py-6 rounded-full text-3xl font-bold hover:bg-red-600 shadow-lg active:scale-95">
                                    <Icon name="Mic" size={40} /> 🎤 녹음 시작
                                </button>
                                <button onClick={() => setPhase('review')}
                                    className="flex-1 flex items-center justify-center gap-3 bg-blue-500 text-white px-8 py-6 rounded-full text-3xl font-bold hover:bg-blue-600 shadow-lg active:scale-95">
                                    ⌨️ 글로 쓸래요
                                </button>
                                <button onClick={() => onComplete({ text: "", base64: null, selfStars: 0, helpCount, sticker: null })}
                                    className="flex items-center justify-center gap-2 bg-gray-300 text-gray-700 px-6 py-6 rounded-full text-2xl font-bold hover:bg-gray-400 active:scale-95">
                                    건너뛰기
                                </button>
                            </div>
                        )}

                        {/* recording: 녹음 중 */}
                        {phase === 'recording' && (
                            <button onClick={stopRecording}
                                className="w-full flex items-center justify-center gap-3 bg-gray-800 text-white px-8 py-6 rounded-full text-3xl font-bold hover:bg-gray-900 shadow-lg ripple active:scale-95">
                                <Icon name="Square" size={40} /> ⏹️ 녹음 끝!
                            </button>
                        )}

                        {/* review: 들어보고 별점 주기 */}
                        {phase === 'review' && (
                            <div className="w-full flex flex-col gap-5">
                                {/* 듣기 버튼들 */}
                                <div className="flex gap-3 flex-wrap">
                                    {audioBlob && (
                                        <button onClick={playBack}
                                            className="flex-1 min-w-[200px] flex items-center justify-center gap-2 bg-purple-500 text-white px-6 py-4 rounded-full text-2xl font-bold hover:bg-purple-600 active:scale-95">
                                            <Icon name="Play" size={28} /> 내 녹음 듣기
                                        </button>
                                    )}
                                    {text && (
                                        <button onClick={playText}
                                            className="flex-1 min-w-[200px] flex items-center justify-center gap-2 bg-indigo-500 text-white px-6 py-4 rounded-full text-2xl font-bold hover:bg-indigo-600 active:scale-95">
                                            <Icon name="Volume2" size={28} /> 완성한 문장 듣기
                                        </button>
                                    )}
                                </div>

                                {/* 자기 별점 */}
                                <div className="bg-yellow-50 border-4 border-yellow-300 rounded-3xl p-5">
                                    <p className="text-3xl font-bold text-yellow-800 text-center mb-3">⭐ 내 녹음, 어떤 것 같아요?</p>
                                    <div className="flex gap-3 justify-center">
                                        {[1, 2, 3, 4, 5].map(n => (
                                            <button key={n} onClick={() => handleSelfStar(n)}
                                                className="star-btn">
                                                <Icon name="Star" size={60}
                                                    className={selfStars >= n ? 'text-yellow-400 fill-yellow-400' : 'text-gray-300 fill-gray-100'} />
                                            </button>
                                        ))}
                                    </div>
                                </div>

                                {/* 별점 결과에 따른 안내 */}
                                {selfStars > 0 && selfStars <= 3 && (
                                    <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }}

                                        <p className="text-3xl font-bold text-orange-700 mb-3">💪 한 번 더 도전해볼래요?</p>
                                        <p className="text-2xl text-orange-600 mb-4">더 잘 할 수 있어요!</p>
                                        <div className="flex gap-3 justify-center">
                                            <button onClick={retryRecord}
                                                className="bg-orange-500 text-white px-8 py-4 rounded-full text-2xl font-bold hover:bg-orange-600 active:scale-95">
                                                🔄 다시 녹음할래요!
                                            </button>
                                            <button onClick={() => setPhase('sticker')}
                                                className="bg-gray-300 text-gray-700 px-8 py-4 rounded-full text-2xl font-bold hover:bg-gray-400 active:scale-95">

                                            </button>
                                        </div>
                                    </motion.div>
                                )}

                                {selfStars >= 4 && (
                                    <motion.div initial={{ opacity: 0, y: 10 }} animate={{ opacity: 1, y: 0 }}
                                        className="bg-green-50 border-4 border-green-300 rounded-3xl p-5 text-center">
                                        <p className="text-3xl font-bold text-green-700 mb-3">🌟 정말 잘했어요!</p>
                                        <div className="flex gap-3 justify-center flex-wrap">
                                            <button onClick={retryRecord}
                                                className="bg-blue-400 text-white px-8 py-4 rounded-full text-2xl font-bold hover:bg-blue-500 active:scale-95">
                                                🔄 그래도 다시 녹음할래요
                                            </button>
                                            <button onClick={() => setPhase('sticker')}
                                                className="bg-green-500 text-white px-8 py-4 rounded-full text-2xl font-bold hover:bg-green-600 active:scale-95">
                                                ✨ 칭찬 스티커 받기!
                                            </button>
                                        </div>
                                    </motion.div>
                                )}

                                {/* 키보드만 사용한 경우의 다음 버튼 */}
                                {selfStars === 0 && text && !audioBlob && (
                                    <button onClick={() => setPhase('sticker')}
                                        className="w-full bg-green-500 text-white py-5 rounded-full text-3xl font-bold hover:bg-green-600 active:scale-95">
                                        다음으로 →
                                    </button>
                                )}

                                {!text && !audioBlob && selfStars === 0 && (
                                    <button onClick={() => onComplete({ text: "", base64: null, selfStars: 0, helpCount, sticker: null })}
                                        className="w-full bg-gray-300 text-gray-700 py-5 rounded-full text-2xl font-bold hover:bg-gray-400 active:scale-95">
                                        건너뛰기
                                    </button>
                                )}
                            </div>
                        )}

                        {/* sticker: 칭찬 스티커 받기 */}
                        {phase === 'sticker' && (
                            <div className="w-full flex flex-col gap-5">
                                <StickerReward
                                    label="녹음 완료 스티커"
                                    onAdd={(s) => {
                                        setStickerGiven(s);
                                        setCollectedStickers(prev => [...prev, s]);
                                        setTimeout(() => finalSubmit(), 1500);

                                />
                                <button onClick={finalSubmit}
                                    className="w-full bg-gray-300 text-gray-700 py-4 rounded-full text-2xl font-bold hover:bg-gray-400 active:scale-95">
                                    스티커 없이 다음으로 →
                                </button>
                            </div>

                    </div>
                );
            };

            // ============================================================
            // 설계도 컴포넌트 (튜토리얼 + 화면녹화 안내)
            // ============================================================
            const BlueprintComponent = ({ onComplete }) => {
                const canvasRef = useRef(null);
                const bgCanvasRef = useRef(null);
                const fileInputRef = useRef(null);
                const [color, setColor] = useState('#1e293b');
                const [tool, setTool] = useState('pen');
                const [shapes, setShapes] = useState([]);
                const [selectedId, setSelectedId] = useState(null);
                const [isDrawing, setIsDrawing] = useState(false);
                // 튜토리얼: 1단계(만들 작품 설명) → 2단계(녹화 안내) → 닫기
                const [tutorialStep, setTutorialStep] = useState(1);
                const [showTutorial, setShowTutorial] = useState(true);
                const dragStart = useRef(null);
                const shapeSize = useRef(120);
                const penLines = useRef([]);
                const currentLine = useRef(null);
                const COLORS = ['#ef4444', '#f97316', '#eab308', '#22c55e', '#3b82f6', '#a855f7', '#1e293b', '#64748b', '#ffffff'];

                useEffect(() => {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                }, []);

                const getPos = (e) => {
                    const canvas = canvasRef.current;
                    const rect = canvas.getBoundingClientRect();
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    return {
                        x: (clientX - rect.left) * (canvas.width / rect.width),
                        y: (clientY - rect.top) * (canvas.height / rect.height)
                    };
                };

                const redraw = (shapeList) => {
                    const canvas = canvasRef.current;
                    const ctx = canvas.getContext('2d');
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    ctx.fillStyle = '#ffffff';
                    ctx.fillRect(0, 0, canvas.width, canvas.height);
                    const bg = bgCanvasRef.current;
                    if (bg) ctx.drawImage(bg, 0, 0);
                    penLines.current.forEach(line => {
                        if (!line || line.length < 2) return;
                        ctx.beginPath();
                        ctx.strokeStyle = line[0].color;
                        ctx.lineWidth = line[0].width;
                        ctx.lineCap = 'round'; ctx.lineJoin = 'round';
                        ctx.moveTo(line[0].x, line[0].y);
                        line.forEach(pt => ctx.lineTo(pt.x, pt.y));
                        ctx.stroke();
                    });
                    shapeList.forEach(shape => {
                        ctx.save();
                        ctx.translate(shape.x, shape.y);
                        ctx.rotate((shape.rotate || 0) * Math.PI / 180);
                        const hw = shape.w / 2, hh = shape.h / 2;
                        ctx.fillStyle = shape.color;
                        ctx.strokeStyle = shape.id === selectedId ? '#3b82f6' : 'rgba(0,0,0,0.15)';
                        ctx.lineWidth = 5;
                        ctx.beginPath();
                        if (shape.type === 'circle') {
                            ctx.ellipse(0, 0, hw, hh, 0, 0, Math.PI * 2);
                            ctx.fill(); ctx.stroke();
                        } else if (shape.type === 'square') {
                            ctx.fillRect(-hw, -hh, shape.w, shape.h);
                            ctx.strokeRect(-hw, -hh, shape.w, shape.h);
                        } else if (shape.type === 'triangle') {
                            ctx.moveTo(0, -hh); ctx.lineTo(hw, hh); ctx.lineTo(-hw, hh);
                            ctx.closePath(); ctx.fill(); ctx.stroke();
                        }
                        if (shape.id === selectedId) {
                            ctx.fillStyle = '#3b82f6';
                            [[hw, -hh], [hw, hh], [-hw, -hh], [-hw, hh]].forEach(([hx, hy]) => {
                                ctx.beginPath(); ctx.arc(hx, hy, 12, 0, Math.PI * 2); ctx.fill();
                            });
                            ctx.fillStyle = '#f59e0b';
                            ctx.beginPath(); ctx.arc(0, -hh - 36, 16, 0, Math.PI * 2); ctx.fill();
                        }
                        ctx.restore();
                    });
                };

                useEffect(() => { redraw(shapes); }, [shapes, selectedId]);

                const toLocal = (shape, pos) => {
                    const angle = (shape.rotate || 0) * Math.PI / 180;
                    const cos = Math.cos(-angle), sin = Math.sin(-angle);
                    const dx = pos.x - shape.x, dy = pos.y - shape.y;
                    return { x: dx * cos - dy * sin, y: dx * sin + dy * cos };
                };

                const HANDLE_R = 22;

                const onPointerDown = (e) => {
                    e.preventDefault();
                    const pos = getPos(e);
                    if (tool === 'select') {
                        if (selectedId) {
                            const shape = shapes.find(s => s.id === selectedId);
                            if (shape) {
                                const hw = shape.w / 2, hh = shape.h / 2;
                                const lp = toLocal(shape, pos);
                                if (Math.hypot(lp.x, lp.y + hh + 36) < HANDLE_R) {
                                    dragStart.current = { mode: 'rotate', shapeId: shape.id, cx: shape.x, cy: shape.y };
                                    return;
                                }
                                const corners = [{ lx: hw, ly: -hh }, { lx: hw, ly: hh }, { lx: -hw, ly: -hh }, { lx: -hw, ly: hh }];
                                for (const c of corners) {
                                    if (Math.hypot(lp.x - c.lx, lp.y - c.ly) < HANDLE_R) {
                                        dragStart.current = { mode: 'resize', shapeId: shape.id, origW: shape.w, origH: shape.h };
                                        return;
                                    }
                                }
                            }
                        }
                        const hit = [...shapes].reverse().find(s => {
                            const lp = toLocal(s, pos);
                            return Math.abs(lp.x) <= s.w / 2 && Math.abs(lp.y) <= s.h / 2;
                        });
                        setSelectedId(hit ? hit.id : null);
                        dragStart.current = hit ? { mode: 'move', ...pos, origX: hit.x, origY: hit.y, shapeId: hit.id } : null;
                        return;
                    }
                    if (tool === 'pen' || tool === 'eraser') {
                        setIsDrawing(true);
                        currentLine.current = [{ x: pos.x, y: pos.y, color: tool === 'eraser' ? '#ffffff' : color, width: tool === 'eraser' ? 36 : 6 }];
                        return;
                    }
                    const newShape = { id: Date.now(), type: tool, x: pos.x, y: pos.y, w: shapeSize.current, h: shapeSize.current, color, rotate: 0 };
                    setShapes(prev => [...prev, newShape]);
                    setSelectedId(newShape.id);
                    setTool('select');
                };

                const onPointerMove = (e) => {
                    e.preventDefault();
                    const pos = getPos(e);
                    if ((tool === 'pen' || tool === 'eraser') && isDrawing && currentLine.current) {
                        currentLine.current.push({ x: pos.x, y: pos.y, color: currentLine.current[0].color, width: currentLine.current[0].width });
                        const ctx = canvasRef.current.getContext('2d');
                        const last = currentLine.current;
                        if (last.length >= 2) {
                            ctx.beginPath(); ctx.strokeStyle = last[0].color; ctx.lineWidth = last[0].width;
                            ctx.lineCap = 'round';
                            const p2 = last[last.length - 2], p1 = last[last.length - 1];
                            ctx.moveTo(p2.x, p2.y); ctx.lineTo(p1.x, p1.y); ctx.stroke();
                        }
                        return;
                    }
                    if (tool === 'select' && dragStart.current) {
                        const dr = dragStart.current;
                        if (dr.mode === 'rotate') {
                            const angle = Math.atan2(pos.y - dr.cy, pos.x - dr.cx) * 180 / Math.PI + 90;
                            setShapes(prev => prev.map(s => s.id === dr.shapeId ? { ...s, rotate: angle } : s));
                        } else if (dr.mode === 'resize') {
                            const shape = shapes.find(s => s.id === dr.shapeId);
                            if (!shape) return;
                            const lp = toLocal(shape, pos);
                            const newW = Math.max(40, Math.abs(lp.x) * 2);
                            const newH = Math.max(40, Math.abs(lp.y) * 2);
                            setShapes(prev => prev.map(s => s.id === dr.shapeId ? { ...s, w: newW, h: newH } : s));
                        } else if (dr.mode === 'move') {
                            const dx = pos.x - dr.x, dy = pos.y - dr.y;
                            setShapes(prev => prev.map(s => s.id === dr.shapeId ? { ...s, x: dr.origX + dx, y: dr.origY + dy } : s));
                        }
                    }
                };

                const onPointerUp = () => {
                    if ((tool === 'pen' || tool === 'eraser') && currentLine.current && currentLine.current.length > 1) {
                        penLines.current = [...penLines.current, currentLine.current];
                        redraw(shapes);
                    }
                    currentLine.current = null;
                    setIsDrawing(false);
                    dragStart.current = null;
                };

                const deleteSelected = () => { setShapes(prev => prev.filter(s => s.id !== selectedId)); setSelectedId(null); };

                const handleFileUpload = (e) => {
                    const file = e.target.files[0];
                    if (!file) return;
                    const reader = new FileReader();
                    reader.onload = (ev) => {
                        const img = new Image();
                        img.onload = () => {
                            const bg = bgCanvasRef.current;
                            const bgCtx = bg.getContext('2d');
                            const ratio = Math.min(bg.width / img.width, bg.height / img.height);
                            bgCtx.clearRect(0, 0, bg.width, bg.height);
                            bgCtx.drawImage(img, (bg.width - img.width * ratio) / 2, (bg.height - img.height * ratio) / 2, img.width * ratio, img.height * ratio);
                            redraw(shapes);
                        };
                        img.src = ev.target.result;
                    };
                    reader.readAsDataURL(file);
                };

                const clearAll = () => {
                    penLines.current = []; setShapes([]); setSelectedId(null);
                    const bg = bgCanvasRef.current;
                    if (bg) bg.getContext('2d').clearRect(0, 0, bg.width, bg.height);
                    const ctx = canvasRef.current.getContext('2d');
                    ctx.fillStyle = '#ffffff'; ctx.fillRect(0, 0, canvasRef.current.width, canvasRef.current.height);
                };

                const submit = () => {
                    if (isScreenRecording) stopScreenRecording();
                    onComplete(canvasRef.current.toDataURL('image/png'));
                };

                const ToolBtn = ({ t, icon, label }) => (
                    <button onClick={() => { setTool(t); setSelectedId(null); }}
                        className={`py-3 rounded-xl flex flex-col items-center gap-1 border-4 text-xl font-bold ${tool === t ? 'bg-blue-100 border-blue-400 text-blue-700' : 'bg-slate-50 border-slate-200 text-slate-500'}`}>
                        <Icon name={icon} size={36} /><span>{label}</span>
                    </button>
                );

                // 튜토리얼에서 녹화 시작 시도 후 무조건 닫기
                const handleStartRecording = async () => {
                    await startScreenRecording();
                    setShowTutorial(false);
                };

                const handleSkipRecording = () => {
                    setShowTutorial(false);
                };

                return (
                    <div className="absolute inset-0 bg-slate-100 flex flex-row gap-5 p-5">

                        {/* 튜토리얼 팝업 - 2단계 */}
                        {showTutorial && (
                            <div className="absolute inset-0 z-50 bg-black/70 flex items-center justify-center p-8">

                                {/* 1단계: "무엇을 만들 건지 말하면서 그려요!" */}
                                {tutorialStep === 1 && (
                                    <motion.div
                                        initial={{ scale: 0.8, opacity: 0 }}
                                        animate={{ scale: 1, opacity: 1 }}
                                        className="bg-white rounded-[2.5rem] shadow-2xl border-8 border-purple-300 max-w-3xl w-full overflow-hidden">

                                        <div className="bg-purple-500 px-8 py-5 flex items-center justify-between">
                                            <span className="text-white text-3xl font-bold">📖 설계도 그리기 안내</span>
                                            <span className="bg-white/30 text-white text-2xl font-bold px-4 py-1 rounded-full">1 / 2</span>
                                        </div>

                                        <div className="p-10 flex flex-col gap-6">
                                            <div className="text-[5rem] text-center leading-none">🗣️🎨</div>
                                            <h2 className="text-5xl font-bold text-center text-purple-800 leading-tight">
                                                그리면서 말해봐요!
                                            </h2>

                                            <div className="bg-purple-50 border-4 border-purple-200 rounded-3xl p-6 flex flex-col gap-4">
                                                <p className="text-3xl font-bold text-slate-800 leading-relaxed text-center">
                                                    설계도를 그리면서<br />
                                                    <span className="bg-yellow-200 px-3 py-1 rounded-xl text-purple-700">"무엇을 만들 건지"</span><br />
                                                    소리 내어 말해봐요!
                                                </p>
                                            </div>

                                            <div className="bg-yellow-50 border-4 border-yellow-300 rounded-3xl p-5">
                                                <p className="text-2xl font-bold text-yellow-900 mb-3">💡 이렇게 말해봐요:</p>
                                                <div className="flex flex-col gap-2">
                                                    <div className="bg-white px-4 py-3 rounded-xl border-2 border-yellow-200 text-xl font-bold text-slate-700">
                                                        💬 "저는 페트병으로 화분을 만들 거예요!"
                                                    </div>
                                                    <div className="bg-white px-4 py-3 rounded-xl border-2 border-yellow-200 text-xl font-bold text-slate-700">
                                                        💬 "여기에 캔으로 로봇 몸통을 만들어요!"
                                                    </div>
                                                    <div className="bg-white px-4 py-3 rounded-xl border-2 border-yellow-200 text-xl font-bold text-slate-700">
                                                        💬 "종이상자에 바퀴를 붙여서 트럭을 만들 거예요!"
                                                    </div>
                                                </div>
                                            </div>

                                            <button onClick={() => setTutorialStep(2)}
                                                className="w-full bg-purple-500 text-white py-5 rounded-full text-3xl font-bold shadow-lg hover:bg-purple-600 active:scale-95">
                                                다음 →
                                            </button>
                                        </div>
                                    </motion.div>
                                )}

                                {/* 2단계: 화면 녹화 안내 */}
                                {tutorialStep === 2 && (
                                    <motion.div
                                        initial={{ scale: 0.8, opacity: 0 }}
                                        animate={{ scale: 1, opacity: 1 }}
                                        className="bg-white rounded-[2.5rem] shadow-2xl border-8 border-red-300 max-w-3xl w-full overflow-hidden">

                                        <div className="bg-red-500 px-8 py-5 flex items-center justify-between">
                                            <span className="text-white text-3xl font-bold">🎬 그리는 모습 녹화하기</span>
                                            <span className="bg-white/30 text-white text-2xl font-bold px-4 py-1 rounded-full">2 / 2</span>
                                        </div>

                                        <div className="p-10 flex flex-col gap-6">
                                            <div className="text-[5rem] text-center leading-none">🔴🎤</div>
                                            <h2 className="text-4xl font-bold text-center text-red-700 leading-tight">
                                                목소리와 그리는 모습을<br />함께 녹화해요!
                                            </h2>

                                            <div className="bg-red-50 border-4 border-red-200 rounded-3xl p-6">
                                                <p className="text-2xl font-bold text-slate-800 leading-relaxed text-center">
                                                    아래 <span className="bg-red-200 px-3 py-1 rounded-xl text-red-700">🔴 녹화 시작</span> 버튼을 누르면<br />
                                                    화면을 공유하라는 창이 떠요.<br /><br />
                                                    <span className="text-red-600 font-black">"전체 화면"</span>이나<br />
                                                    <span className="text-red-600 font-black">"이 탭"</span>을 선택하고 <span className="bg-blue-200 px-2 py-1 rounded-lg">공유</span>를 눌러요!
                                                </p>
                                            </div>

                                            <div className="bg-blue-50 border-4 border-blue-200 rounded-3xl p-5">
                                                <p className="text-xl font-bold text-blue-800 leading-relaxed text-center">
                                                    💡 컴퓨터가 녹화를 못 해도 괜찮아요!<br />
                                                    <span className="text-blue-600">"녹화 없이 그릴래요"</span> 버튼을 누르면<br />
                                                    그냥 그리기만 해도 돼요.
                                                </p>
                                            </div>

                                            <div className="flex flex-col gap-3">
                                                <button onClick={handleStartRecording}
                                                    className="w-full bg-red-500 text-white py-5 rounded-full text-3xl font-bold shadow-lg hover:bg-red-600 active:scale-95">
                                                    🔴 녹화 시작하고 그리기!
                                                </button>
                                                <button onClick={handleSkipRecording}
                                                    className="w-full bg-slate-300 text-slate-700 py-4 rounded-full text-2xl font-bold hover:bg-slate-400 active:scale-95">

                                        <p className="text-base font-bold text-slate-600 text-center">🎬 화면 녹화</p>

                        {/* 도화지 */}

                        </div>
